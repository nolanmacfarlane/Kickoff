<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kickoff: spontaneous sports meetups</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">

  <!-- Order matters: tokens -> base -> layout -> shared components -> per-screen styles -->
  <link rel="stylesheet" href="css/vendor/leaflet.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/invite.css">
  <link rel="stylesheet" href="css/social.css">
  <link rel="stylesheet" href="css/sport.css">
</head>
<!-- data-auth is switched to "in" by main.ts once a user exists; it hides the tabs during onboarding -->
<body data-auth="out">
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Kickoff home">
      <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
        <g transform="rotate(-16 20 17)">
          <path d="M6 24V13q0-3 3-3h4l2.500-3.500L18.500 9.500C22 14 28 14 31 18c2.500 2 3 4 3 6z" fill="currentColor"/>
          <path d="M17 11.500l3 2M20 13.500l3 2" stroke="var(--surface)" stroke-width="1.400" stroke-linecap="round"/>
          <rect x="5" y="23.500" width="30" height="5" rx="2.500" fill="var(--mark)" stroke="currentColor" stroke-width="1.600"/>
        </g>
        <path d="M2 14h5M1 18h4" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/>
        <path d="M6 37.500h28" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"/>
      </svg>
      <span class="brand__name">Kickoff</span>
    </a>

    <nav class="tabs" aria-label="Main">
      <a class="tab" href="#/home" data-tab="home">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 11h3v9h12v-9h3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="tab__label">Home</span>
      </a>
      <a class="tab" href="#/map" data-tab="map">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="tab__label">Map</span>
      </a>
      <a class="tab tab--create" href="#/create" data-tab="create">
        <span class="tab__plus" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </span>
        <span class="tab__label">Create invite</span>
      </a>
      <a class="tab" href="#/social" data-tab="social">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M14.5 14.3c.8-.3 1.6-.4 2.5-.4 2.2 0 3.9 1.4 4.5 4.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="tab__label">Social</span>
        <span class="badge tab__badge" id="social-badge" hidden>0</span>
      </a>
      <a class="tab" href="#/profile" data-tab="profile">
        <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.8-4 3.5-6 7-6s6.200 2 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="tab__label">Profile</span>
      </a>
    </nav>
  </header>

  <main id="app" class="page" tabindex="-1">
    <noscript><p class="notice">This prototype needs JavaScript. Open it in a current browser with scripts enabled.</p></noscript>
  </main>

  <!-- Invite detail and confirmations render into these -->
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
